name: Catalogo
options:
  bundleIdPrefix: pe.isil.pa2
  deploymentTarget:
    iOS: "17.0"
targets:
  Catalogo:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.isil.pa2.catalogo
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Catalogo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
  CatalogoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Catalogo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.isil.pa2.catalogo.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Catalogo:
    build:
      targets:
        Catalogo: all
    test:
      targets:
        - CatalogoUITests
