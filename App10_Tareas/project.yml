name: Tareas
options:
  bundleIdPrefix: pe.isil.pa2
  deploymentTarget:
    iOS: "17.0"
targets:
  Tareas:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.isil.pa2.tareas
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Tareas
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
  TareasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Tareas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.isil.pa2.tareas.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tareas:
    build:
      targets:
        Tareas: all
    test:
      targets:
        - TareasUITests
