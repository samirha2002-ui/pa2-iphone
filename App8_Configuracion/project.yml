name: Configuracion
options:
  bundleIdPrefix: pe.isil.pa2
  deploymentTarget:
    iOS: "17.0"
targets:
  Configuracion:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.isil.pa2.configuracion
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Configuracion
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
  ConfiguracionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Configuracion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.isil.pa2.configuracion.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Configuracion:
    build:
      targets:
        Configuracion: all
    test:
      targets:
        - ConfiguracionUITests
