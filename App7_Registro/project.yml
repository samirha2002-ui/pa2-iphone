name: Registro
options:
  bundleIdPrefix: pe.isil.pa2
  deploymentTarget:
    iOS: "17.0"
targets:
  Registro:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.isil.pa2.registro
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Registro
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
  RegistroUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Registro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.isil.pa2.registro.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Registro:
    build:
      targets:
        Registro: all
    test:
      targets:
        - RegistroUITests
