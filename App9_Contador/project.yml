name: Contador
options:
  bundleIdPrefix: pe.isil.pa2
  deploymentTarget:
    iOS: "17.0"
targets:
  Contador:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.isil.pa2.contador
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Contador
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
  ContadorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Contador
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.isil.pa2.contador.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Contador:
    build:
      targets:
        Contador: all
    test:
      targets:
        - ContadorUITests
